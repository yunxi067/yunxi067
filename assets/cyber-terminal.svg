<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">yunxi067 cyber terminal profile banner</title>
  <desc id="desc">Animated cyber terminal banner with scanlines, signal bars, and project text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070908"/>
      <stop offset="0.55" stop-color="#0b1010"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7ff2e"/>
      <stop offset="0.45" stop-color="#28d8ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#c7ff2e" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="1" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0H1V1H0Z" fill="#c7ff2e" fill-opacity=".12"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="48" y="44" width="1104" height="332" rx="10"/>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .title { font-size: 82px; font-weight: 900; letter-spacing: 0; }
      .sub { font-size: 20px; letter-spacing: 0; }
      .tiny { font-size: 14px; letter-spacing: 0; }
      .blink { animation: blink 1.05s steps(2,end) infinite; }
      .sweep { animation: sweep 4.8s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      .bar1 { animation: load 1.8s ease-in-out infinite; transform-origin: left; }
      .bar2 { animation: load 2.2s ease-in-out .24s infinite; transform-origin: left; }
      .bar3 { animation: load 2.7s ease-in-out .48s infinite; transform-origin: left; }
      .noise { animation: noise 1.6s steps(4,end) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes sweep {
        0% { transform: translateY(-90px); opacity: 0; }
        15% { opacity: .45; }
        85% { opacity: .45; }
        100% { transform: translateY(430px); opacity: 0; }
      }
      @keyframes pulse {
        0%,100% { opacity: .42; transform: scale(1); }
        50% { opacity: .95; transform: scale(1.035); }
      }
      @keyframes load {
        0%,100% { transform: scaleX(.24); opacity: .35; }
        50% { transform: scaleX(1); opacity: 1; }
      }
      @keyframes noise {
        0% { transform: translate(0,0); }
        25% { transform: translate(5px,-2px); }
        50% { transform: translate(-4px,2px); }
        75% { transform: translate(2px,3px); }
        100% { transform: translate(0,0); }
      }
    </style>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect width="1200" height="420" fill="url(#scan)" opacity=".6"/>

  <g clip-path="url(#screenClip)">
    <rect x="48" y="44" width="1104" height="332" rx="10" fill="#080b09" stroke="#c7ff2e" stroke-opacity=".48"/>
    <rect x="48" y="44" width="1104" height="36" fill="#101611"/>
    <circle cx="74" cy="62" r="6" fill="#ff2e88"/>
    <circle cx="96" cy="62" r="6" fill="#ffc247"/>
    <circle cx="118" cy="62" r="6" fill="#c7ff2e"/>
    <text x="146" y="67" fill="#9fac9f" class="mono tiny">~/github/yunxi067 :: signal-ready</text>

    <g transform="translate(78 132)">
      <text fill="#c7ff2e" class="mono tiny">$ whoami</text>
      <text x="0" y="92" fill="#f4f1e8" class="mono title" filter="url(#glow)">YUNXI067</text>
      <text x="4" y="130" fill="#28d8ff" class="mono sub">building small tools for developers who like clean terminals</text>
      <text x="4" y="174" fill="#a9a7a0" class="mono tiny">README Doctor  /  Windows Dev Doctor  /  Dev Toolbox CN</text>
      <rect x="562" y="160" width="11" height="18" fill="#c7ff2e" class="blink"/>
    </g>

    <g transform="translate(790 130)">
      <text x="0" y="0" fill="#9fac9f" class="mono tiny">SYSTEM SIGNAL</text>
      <rect y="30" width="230" height="16" fill="#c7ff2e" fill-opacity=".18" stroke="#c7ff2e" stroke-opacity=".32"/>
      <rect y="30" width="230" height="16" fill="#c7ff2e" class="bar1"/>
      <rect y="66" width="230" height="16" fill="#28d8ff" fill-opacity=".18" stroke="#28d8ff" stroke-opacity=".32"/>
      <rect y="66" width="230" height="16" fill="#28d8ff" class="bar2"/>
      <rect y="102" width="230" height="16" fill="#ff2e88" fill-opacity=".18" stroke="#ff2e88" stroke-opacity=".32"/>
      <rect y="102" width="230" height="16" fill="#ff2e88" class="bar3"/>
      <text x="0" y="162" fill="#c7ff2e" class="mono tiny">STATUS: SHIPPING</text>
    </g>

    <g class="noise" opacity=".65">
      <rect x="1006" y="84" width="118" height="3" fill="#ff2e88"/>
      <rect x="1018" y="96" width="86" height="3" fill="#28d8ff"/>
      <rect x="984" y="344" width="132" height="3" fill="#c7ff2e"/>
      <rect x="78" y="330" width="92" height="3" fill="#28d8ff"/>
    </g>

    <rect x="48" y="44" width="1104" height="64" fill="url(#acid)" opacity=".08"/>
    <rect x="48" y="44" width="1104" height="76" fill="#c7ff2e" opacity=".16" class="sweep"/>
  </g>

  <rect x="48" y="44" width="1104" height="332" rx="10" fill="none" stroke="url(#acid)" stroke-opacity=".86"/>
  <rect x="34" y="30" width="1132" height="360" rx="18" fill="none" stroke="#f4f1e8" stroke-opacity=".08"/>
</svg>
